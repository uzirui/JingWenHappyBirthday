<!doctype html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静汶 | 生日快乐</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css">
</head>

<body>
    <audio id="bgm" src="./music/2.mp3" autoplay="autoplay" loop="loop"></audio>

    <iframe src="./html/login.html" id="iframepage" scrolling="no" onload="changeFrameHeight()" frameborder="0"
        style="width:100%" marginwidth="0" marginheight="0"></iframe>

    <script>
        // 按iframe内页面实际高度自适应调整外层iframe高度
        function changeFrameHeight() {
            var iframe = document.getElementById('iframepage');
            var h = window.innerHeight;
            try {
                h = iframe.contentWindow.document.body.scrollHeight;
            } catch (e) {
                // 本地以file://方式打开时可能受跨源限制，退回视口高度
            }
            iframe.style.height = h + 'px';
        }
        window.addEventListener('resize', changeFrameHeight);

        // 移动端浏览器会拦截音频自动播放，用户首次点击页面时恢复背景音乐
        document.addEventListener('click', function () {
            var bgm = document.getElementById('bgm');
            if (bgm) {
                bgm.play().catch(function () { });
            }
        }, { once: true });
    </script>
</body>

</html>
